<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Parafuso Trader</title>
  <style>
    :root {
      --bg-main: #11141c;
      --bg-card: rgba(27, 31, 43, 0.88);
      --bg-input: #232836;
      --border-color: #2e3446;
      --brand-orange: #ff5722;
      --accent-green: #00b050;
      --accent-red: #e53935;
      --text-primary: #ffffff;
      --text-secondary: #8e96aa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #chart-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      opacity: 0.42;
      -webkit-mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 1) 25%, rgba(0, 0, 0, 0) 80%);
      mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 1) 25%, rgba(0, 0, 0, 0) 80%);
    }

    .login-container {
      position: relative;
      z-index: 1;
      background-color: var(--bg-card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      padding: 36px 32px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.65);
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background-color: var(--brand-orange);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      font-size: 19px;
      box-shadow: 0 0 15px rgba(255, 87, 34, 0.5);
    }

    .brand-name {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand-name span {
      color: var(--brand-orange);
    }

    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 26px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 14px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: var(--brand-orange);
      box-shadow: 0 0 0 3px rgba(255, 87, 34, 0.15);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .form-options a {
      color: var(--brand-orange);
      text-decoration: none;
    }

    .form-options a:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      background-color: var(--accent-green);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: filter 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px rgba(0, 176, 80, 0.3);
    }

    .btn-login:hover {
      filter: brightness(1.1);
    }

    .btn-login:active {
      transform: scale(0.99);
    }

    .footer-links {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .footer-links a {
      color: var(--text-primary);
      font-weight: 600;
      text-decoration: none;
    }

    .footer-links a:hover {
      color: var(--brand-orange);
    }

    .support-bar {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <canvas id="chart-bg"></canvas>

  <div class="login-container">
    <div class="brand-header">
      <div class="brand-icon">⚙</div>
      <div class="brand-name">parafuso<span>trader</span></div>
    </div>

    <p class="subtitle">Acesse sua conta para operar nos mercados</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">E-mail ou ID de Usuário</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="form-options">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; opacity: 0;">
          <input type="checkbox" id="is_demo" name="is_demo" checked> Conta Demo
        </label>
        <a href="#recuperar-senha">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn-login">ENTRAR NA PLATAFORMA</button>
    </form>

    <script>
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const is_demo = true;
        const apiBase = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
          ? 'http://127.0.0.1:4000'
          : window.location.origin;

        try {
          const response = await fetch(`${apiBase}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, is_demo })
          });
          const result = await response.json();
          if (result.success) {
            localStorage.setItem('parafuso_ssid', result.data);
            alert('Login efetuado com sucesso!');
            window.location.href = '/';
          } else {
            alert('Erro: ' + result.message);
          }
        } catch (err) {
          alert('Erro de conexão com o servidor.');
        }
      });
    </script>

    <div class="footer-links">
      Ainda não tem conta? <a href="#cadastro">Criar conta gratuita</a>
    </div>

    <div class="support-bar">
      Suporte 24/7 • suport@parafusotrader.com
    </div>
  </div>

  <script>
    const canvas = document.getElementById('chart-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let candles = [];
    const candleWidth = 14;
    const candleSpacing = 22;
    let offsetX = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initCandles();
    }

    function generateNextCandle(prevClose) {
      const change = (Math.random() - 0.48) * 35;
      const open = prevClose;
      let close = open + change;

      if (close < height * 0.25) close += 25;
      if (close > height * 0.75) close -= 25;

      const high = Math.max(open, close) + Math.random() * 18;
      const low = Math.min(open, close) - Math.random() * 18;

      return { open, close, high, low };
    }

    function initCandles() {
      candles = [];
      const count = Math.ceil(width / candleSpacing) + 5;
      let lastClose = height / 2;
      for (let i = 0; i < count; i++) {
        const candle = generateNextCandle(lastClose);
        candles.push(candle);
        lastClose = candle.close;
      }
    }

    function drawGrid() {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      const gridSize = 50;

      for (let x = (offsetX % gridSize); x < width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }

      for (let y = 0; y < height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
    }

    function drawCandles() {
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(156, 39, 176, 0.55)';
      ctx.lineWidth = 2;

      candles.forEach((c, index) => {
        const x = index * candleSpacing + offsetX;
        const midY = (c.open + c.close) / 2;
        if (index === 0) ctx.moveTo(x + candleWidth / 2, midY);
        else ctx.lineTo(x + candleWidth / 2, midY);
      });
      ctx.stroke();

      candles.forEach((c, index) => {
        const x = index * candleSpacing + offsetX;
        const isBullish = c.close <= c.open;
        const color = isBullish ? '#00b050' : '#e53935';

        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x + candleWidth / 2, c.high);
        ctx.lineTo(x + candleWidth / 2, c.low);
        ctx.stroke();

        ctx.fillStyle = color;
        const bodyTop = Math.min(c.open, c.close);
        const bodyHeight = Math.max(Math.abs(c.close - c.open), 3);
        ctx.fillRect(x, bodyTop, candleWidth, bodyHeight);
      });
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      drawGrid();
      drawCandles();

      offsetX -= 0.35;

      const last = candles[candles.length - 1];
      last.close += (Math.random() - 0.5) * 1.8;
      last.high = Math.min(last.high, Math.min(last.open, last.close));
      last.low = Math.max(last.low, Math.max(last.open, last.close));

      if (offsetX <= -candleSpacing) {
        offsetX += candleSpacing;
        candles.shift();
        const prev = candles[candles.length - 1];
        candles.push(generateNextCandle(prev.close));
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    animate();
  </script>

</body>
</html>
